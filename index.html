<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Email Karyawan PT. ALAM BUMI JASINDO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    
    <!-- Logo + Judul -->
    <div class="flex flex-col items-center mb-6">
      <img src="logo.png" alt="Logo ABJ" class="w-20 h-20 mb-3 drop-shadow-md">
      <h1 class="text-2xl font-bold text-gray-800">Data Email Karyawan</h1>
      <h2 class="text-lg font-semibold text-teal-700">PT. ALAM BUMI JASINDO</h2>
    </div>

    <!-- Note -->
    <div class="bg-yellow-50 border border-yellow-200 text-yellow-800 px-4 py-3 rounded-xl mb-6 text-sm">
      <strong>⚠️ Perhatian:</strong> Harap Pastikan <strong>ID Karyawan</strong> & <strong>Email</strong> diisi dengan benar.
    </div>

    <form id="karyawanForm" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nama Lengkap <span class="text-red-500">*</span></label>
        <input type="text" id="nama" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">ID Karyawan <span class="text-red-500">*</span></label>
        <input type="text" id="id_karyawan" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nomor HP <span class="text-red-500">*</span></label>
        <input type="tel" id="no_hp" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email <span class="text-red-500">*</span></label>
        <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500">
      </div>

      <button type="submit"
              class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3.5 rounded-xl transition text-lg shadow-md">
        Kirim Data
      </button>
    </form>

    <div id="result" class="mt-5 text-center hidden"></div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzOL1pReRB_xjjhNVokcK8yJTIzXyFSGwwy5m1LFwym85cNTh7-d3CR0vxjVUa6_Ho8/exec";

    document.getElementById("karyawanForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const resultDiv = document.getElementById("result");
      resultDiv.classList.remove("hidden");
      resultDiv.innerHTML = `<p class="text-teal-600">⏳ Mengirim data...</p>`;

      const formData = new URLSearchParams();
      formData.append("nama", document.getElementById("nama").value.trim());
      formData.append("id_karyawan", document.getElementById("id_karyawan").value.trim());
      formData.append("no_hp", document.getElementById("no_hp").value.trim());
      formData.append("email", document.getElementById("email").value.trim());

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: formData,
          headers: { "Content-Type": "application/x-www-form-urlencoded" }
        });
        const result = await response.json();

        if (result.status === "success") {
          resultDiv.innerHTML = `<p class="text-green-600 font-semibold">✅ Data berhasil disimpan!</p>`;
          document.getElementById("karyawanForm").reset();
          setTimeout(() => resultDiv.classList.add("hidden"), 4000);
        } else {
          resultDiv.innerHTML = `<p class="text-red-600">❌ ${result.message}</p>`;
        }
      } catch {
        resultDiv.innerHTML = `<p class="text-red-600">❌ Terjadi kesalahan.</p>`;
      }
    });
  </script>
</body>
</html>
